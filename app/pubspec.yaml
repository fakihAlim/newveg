name: newveg
description: "mHealth Plant-Based Diet Application"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  google_fonts: ^6.2.1
  google_generative_ai: ^0.4.0
  image_picker: ^1.0.7
  lottie: ^3.1.0
  intl: ^0.19.0
  flutter_dotenv: ^5.2.1
  connectivity_plus: ^6.0.3
  share_plus: any
  http: ^1.2.0
  image: ^4.1.3
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.2
  build_runner: ^2.4.14
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#059669"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter_native_splash:
  color: "#059669"
  color_dark: "#064e3b"
  image: "assets/images/splash_logo.png"
  android_12:
    color: "#059669"
    color_dark: "#064e3b"
    image: "assets/images/splash_logo.png"
